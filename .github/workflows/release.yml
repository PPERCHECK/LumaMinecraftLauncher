name: Release Luma
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Validate release tag
        run: node -e "if(process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version)process.exit(1)"
      - run: npm test
      - name: Generate setup artwork
        shell: pwsh
        run: ./scripts/installer-art.ps1
      - run: npm run build
      - name: Create version tag for GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (-not (git ls-remote --tags origin "refs/tags/v$version")) {
            git tag "v$version"
            git push origin "v$version"
          }
      - name: Build installer, blockmap and latest.yml
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Publish one complete GitHub Release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          $matching = @($releases | Where-Object tag_name -eq $tag)
          if ($matching.Count -eq 0) {
            gh release create $tag --title "Luma $version" --notes "Windows Setup and automatic update files for Luma $version."
          } elseif ($matching.Count -gt 1) {
            $keep = ($matching | Where-Object { $_.assets.name -contains "Luma-Setup-$version.exe" } | Select-Object -First 1)
            if (-not $keep) { $keep = $matching[0] }
            $matching | Where-Object id -ne $keep.id | ForEach-Object { gh api --method DELETE "repos/${{ github.repository }}/releases/$($_.id)" }
          }
          gh release upload $tag "release/Luma-Setup-$version.exe" "release/Luma-Setup-$version.exe.blockmap" "release/latest.yml" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

