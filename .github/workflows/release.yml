name: Release Luma
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Validate release tag
        run: node -e "if(process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version)process.exit(1)"
      - run: npm test
      - name: Generate setup artwork
        shell: pwsh
        run: ./scripts/installer-art.ps1
      - run: npm run build
      - name: Create version tag for GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git tag "v$version"
          git push origin "v$version"
      - name: Build and publish installer, blockmap and latest.yml
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

